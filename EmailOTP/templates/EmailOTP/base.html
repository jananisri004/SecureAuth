<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SecureAuth{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --cream: #faf7f2;
            --charcoal: #1a1a2e;
            --deep: #16213e;
            --accent: #e8c547;
            --accent2: #f0a500;
            --glass: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --text-primary: #f0ece4;
            --text-muted: rgba(240, 236, 228, 0.6);
            --error: #ff6b6b;
            --success: #6bcb77;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--charcoal);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Atmospheric background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 60% at 20% 20%, rgba(232, 197, 71, 0.12) 0%, transparent 60%),
                radial-gradient(ellipse 60% 80% at 80% 80%, rgba(108, 99, 255, 0.1) 0%, transparent 60%),
                radial-gradient(ellipse 50% 50% at 50% 50%, rgba(22, 33, 62, 0.8) 0%, var(--charcoal) 100%);
            pointer-events: none;
        }

        /* Floating orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(60px);
            pointer-events: none;
            animation: floatOrb 8s ease-in-out infinite;
        }
        .orb-1 {
            width: 400px; height: 400px;
            background: rgba(232, 197, 71, 0.08);
            top: -100px; left: -100px;
            animation-delay: 0s;
        }
        .orb-2 {
            width: 300px; height: 300px;
            background: rgba(108, 99, 255, 0.06);
            bottom: -80px; right: -80px;
            animation-delay: -4s;
        }
        .orb-3 {
            width: 200px; height: 200px;
            background: rgba(240, 165, 0, 0.06);
            top: 50%; left: 70%;
            animation-delay: -2s;
        }

        @keyframes floatOrb {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(20px, -30px) scale(1.05); }
            66% { transform: translate(-15px, 20px) scale(0.95); }
        }

        /* Grid texture */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }

        /* Main card */
        .auth-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 460px;
            padding: 24px;
            animation: slideUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .auth-card {
            background: var(--glass);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 48px 44px;
            box-shadow:
                0 32px 80px rgba(0,0,0,0.4),
                0 0 0 1px rgba(255,255,255,0.05) inset,
                0 1px 0 rgba(255,255,255,0.1) inset;
        }

        /* Logo / Brand */
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 36px;
        }

        .brand-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 24px rgba(232, 197, 71, 0.3);
            flex-shrink: 0;
        }

        .brand-icon svg {
            width: 22px;
            height: 22px;
            fill: var(--charcoal);
        }

        .brand-name {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }

        .brand-name span {
            color: var(--accent);
        }

        /* Headings */
        .auth-heading {
            font-family: 'Playfair Display', serif;
            font-size: 30px;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.2;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .auth-subheading {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 36px;
            line-height: 1.6;
        }

        /* Form elements */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        input[type="email"],
        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 12px;
            color: var(--text-primary);
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            outline: none;
            transition: all 0.25s ease;
            -webkit-appearance: none;
        }

        input[type="email"]::placeholder,
        input[type="text"]::placeholder,
        input[type="number"]::placeholder {
            color: rgba(240, 236, 228, 0.3);
        }

        input[type="email"]:focus,
        input[type="text"]:focus,
        input[type="number"]:focus {
            border-color: rgba(232, 197, 71, 0.5);
            background: rgba(255,255,255,0.09);
            box-shadow: 0 0 0 3px rgba(232, 197, 71, 0.1);
        }

        /* OTP input styling */
        .otp-input {
            letter-spacing: 8px;
            font-size: 22px !important;
            font-weight: 600;
            text-align: center;
        }

        /* Button */
        .btn-primary {
            width: 100%;
            padding: 15px 24px;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
            border: none;
            border-radius: 12px;
            color: var(--charcoal);
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 8px 24px rgba(232, 197, 71, 0.25);
            margin-top: 8px;
            letter-spacing: 0.3px;
            position: relative;
            overflow: hidden;
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(255,255,255,0);
            transition: background 0.2s;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(232, 197, 71, 0.35);
        }

        .btn-primary:hover::before {
            background: rgba(255,255,255,0.1);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        /* Alert messages */
        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13.5px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .alert-error {
            background: rgba(255, 107, 107, 0.12);
            border: 1px solid rgba(255, 107, 107, 0.25);
            color: #ff9999;
        }

        .alert-success {
            background: rgba(107, 203, 119, 0.12);
            border: 1px solid rgba(107, 203, 119, 0.25);
            color: #8debb5;
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 24px 0;
        }

        .divider-line {
            flex: 1;
            height: 1px;
            background: rgba(255,255,255,0.1);
        }

        .divider-text {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* Footer link */
        .auth-footer {
            text-align: center;
            margin-top: 28px;
            font-size: 13.5px;
            color: var(--text-muted);
        }

        .auth-footer a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            transition: opacity 0.2s;
        }

        .auth-footer a:hover {
            opacity: 0.8;
            text-decoration: underline;
        }

        /* Badge */
        .security-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(107, 203, 119, 0.1);
            border: 1px solid rgba(107, 203, 119, 0.2);
            border-radius: 20px;
            padding: 5px 12px;
            font-size: 11.5px;
            color: #8debb5;
            font-weight: 500;
            margin-bottom: 28px;
        }

        .security-badge::before {
            content: '🔒';
            font-size: 12px;
        }

        /* Hidden field */
        input[type="hidden"] { display: none; }

        /* Step indicator */
        .steps {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 32px;
        }

        .step {
            width: 28px;
            height: 4px;
            border-radius: 2px;
            background: rgba(255,255,255,0.15);
            transition: all 0.3s ease;
        }

        .step.active {
            background: var(--accent);
            width: 48px;
        }

        .step.done {
            background: rgba(107, 203, 119, 0.5);
        }

        {% block extra_styles %}{% endblock %}
    </style>
</head>
<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="brand">
                <div class="brand-icon">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 4l6 2.67V11c0 3.88-2.63 7.51-6 8.93C8.63 18.51 6 14.88 6 11V7.67L12 5z"/>
                    </svg>
                </div>
                <span class="brand-name">Secure<span>Auth</span></span>
            </div>

            {% block content %}{% endblock %}
        </div>
    </div>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
